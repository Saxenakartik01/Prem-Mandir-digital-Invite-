                   C 210 43, 218 43, 225 40 
                   C 232 48, 245 51, 250 46 
                   C 255 51, 268 48, 275 40 
                   C 282 43, 290 43, 296 36" 
                fill="none" 
                stroke="url(#goldLightGrad)" 
                stroke-width="0.75" 
                opacity="0.7"/>
          <!-- Hanging pearl strand -->
          <line x1="250" y1="48" x2="250" y2="62" stroke="url(#goldBorderGrad)" stroke-width="0.9" stroke-dasharray="1 2"/>
          <circle cx="250" cy="65" r="2.8" fill="url(#pearlGrad)" stroke="#9e7428" stroke-width="0.5"/>
          <circle cx="249.2" cy="64" r="0.9" fill="#ffffff" opacity="0.9"/>
          <!-- Cusp joints pearls -->
