<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 76" width="100%" height="auto" fill="none" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cca353" stop-opacity="0"/>
      <stop offset="15%" stop-color="#caa14e" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#fae9b8" stop-opacity="1"/>
      <stop offset="85%" stop-color="#caa14e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#cca353" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldLightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7dd"/>
      <stop offset="50%" stop-color="#f3dda0"/>
      <stop offset="100%" stop-color="#caa14e"/>
    </linearGradient>
    <linearGradient id="archFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcf8eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5e5be" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="pearlGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#faecc5"/>
      <stop offset="100%" stop-color="#b38531"/>
    </radialGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6db"/>
      <stop offset="50%" stop-color="#dcb25b"/>
      <stop offset="100%" stop-color="#8b5e19"/>
    </linearGradient>
  </defs>

  <!-- Top hairline border -->
  <line x1="20" y1="20" x2="580" y2="20" stroke="url(#goldBorderGrad)" stroke-width="1.2"/>
  <!-- Guide dots -->
  <line x1="50" y1="24" x2="550" y2="24" stroke="url(#goldBorderGrad)" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.7"/>

  <!-- Repeating Jharokha Arches -->
  
        <g>
          <!-- Jharokha arch frame -->
          <path d="M 0 34 
                   C 8 44, 18 44, 25 39 
                   C 33 51, 45 55, 50 48 
                   C 55 55, 67 51, 75 39 
                   C 82 44, 92 44, 100 34" 
                fill="url(#archFillGrad)" 
                stroke="url(#goldBorderGrad)" 
                stroke-width="1.4" 
                stroke-linecap="round" 
                stroke-linejoin="round"/>
          <!-- Fine inner foil -->
          <path d="M 4 36 
                   C 10 43, 18 43, 25 40 
                   C 32 48, 45 51, 50 46 
                   C 55 51, 68 48, 75 40 
                   C 82 43, 90 43, 96 36" 
                fill="none" 
                stroke="url(#goldLightGrad)" 
                stroke-width="0.75" 
                opacity="0.7"/>
          <!-- Hanging pearl strand -->
          <line x1="50" y1="48" x2="50" y2="62" stroke="url(#goldBorderGrad)" stroke-width="0.9" stroke-dasharray="1 2"/>
          <circle cx="50" cy="65" r="2.8" fill="url(#pearlGrad)" stroke="#9e7428" stroke-width="0.5"/>
          <circle cx="49.2" cy="64" r="0.9" fill="#ffffff" opacity="0.9"/>
          <!-- Cusp joints pearls -->
          <circle cx="25" cy="41" r="1.6" fill="url(#pearlGrad)"/>
          <circle cx="75" cy="41" r="1.6" fill="url(#pearlGrad)"/>
          <!-- Floral bud in center -->
          <circle cx="50" cy="40" r="1.8" fill="url(#goldLightGrad)"/>
        </g>

        <g>
          <!-- Jharokha arch frame -->
          <path d="M 100 34 
                   C 108 44, 118 44, 125 39 
                   C 133 51, 145 55, 150 48 
                   C 155 55, 167 51, 175 39 
                   C 182 44, 192 44, 200 34" 
