        </g>

  <!-- Grand Central Royal Crest (Mandala & Lotus) at (300, 20) -->
  <g transform="translate(300, 20)">
    <!-- Filigree scroll wings left -->
    <path d="M -12 -2 C -35 -14, -65 -12, -90 -2 C -105 5, -120 0, -135 -6 M -65 -12 C -73 -18, -88 -18, -96 -11 M -35 -14 C -43 -20, -55 -20, -62 -14" 
          stroke="url(#goldBorderGrad)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <circle cx="-96" cy="-11" r="1.6" fill="url(#pearlGrad)"/>
    <circle cx="-62" cy="-14" r="1.5" fill="url(#pearlGrad)"/>
    <circle cx="-135" cy="-6" r="1.8" fill="url(#pearlGrad)"/>

    <!-- Filigree scroll wings right -->
    <path d="M 12 -2 C 35 -14, 65 -12, 90 -2 C 105 5, 120 0, 135 -6 M 65 -12 C 73 -18, 88 -18, 96 -11 M 35 -14 C 43 -20, 55 -20, 62 -14" 
          stroke="url(#goldBorderGrad)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <circle cx="96" cy="-11" r="1.6" fill="url(#pearlGrad)"/>
    <circle cx="62" cy="-14" r="1.5" fill="url(#pearlGrad)"/>
    <circle cx="135" cy="-6" r="1.8" fill="url(#pearlGrad)"/>

    <!-- Center Medallion Base / Halo -->
    <circle cx="0" cy="0" r="13" fill="#fffdf6" stroke="url(#goldBorderGrad)" stroke-width="1.3"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="url(#goldLightGrad)" stroke-width="0.7" stroke-dasharray="1.5 2"/>

    <!-- Blooming Royal Lotus Petals -->
    <!-- Upright center petal -->
    <path d="M 0 -11 C -2.5 -6, -3 0, 0 2.5 C 3 0, 2.5 -6, 0 -11 Z" fill="url(#crestGrad)"/>
    <!-- Left petals -->
    <path d="M -1.5 -9.5 C -6 -6, -8 0, -2.5 2.5 C -0.8 0.8, 0 -5, -1.5 -9.5 Z" fill="url(#crestGrad)" opacity="0.9"/>
    <path d="M -2.5 -5 C -9 -2.5, -9.5 3, -3 4.5 C -1.5 2, -0.8 0, -2.5 -5 Z" fill="url(#crestGrad)" opacity="0.8"/>
    <!-- Right petals -->
    <path d="M 1.5 -9.5 C 6 -6, 8 0, 2.5 2.5 C 0.8 0.8, 0 -5, 1.5 -9.5 Z" fill="url(#crestGrad)" opacity="0.9"/>
    <path d="M 2.5 -5 C 9 -2.5, 9.5 3, 3 4.5 C 1.5 2, 0.8 0, 2.5 -5 Z" fill="url(#crestGrad)" opacity="0.8"/>

    <!-- Center pearl gem -->
    <circle cx="0" cy="0" r="3" fill="url(#pearlGrad)" stroke="#9e7428" stroke-width="0.7"/>
    <circle cx="-0.7" cy="-0.8" r="0.9" fill="#ffffff" opacity="0.9"/>

    <!-- Hanging center pendant drop -->
    <line x1="0" y1="13" x2="0" y2="22" stroke="url(#goldBorderGrad)" stroke-width="1"/>
    <circle cx="0" cy="25" r="3.2" fill="url(#pearlGrad)" stroke="#9e7428" stroke-width="0.7"/>
    <circle cx="-0.8" cy="24" r="1" fill="#ffffff" opacity="0.9"/>
  </g>
