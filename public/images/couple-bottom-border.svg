          <circle cx="150" cy="65" r="2.8" fill="url(#pearlGrad)" stroke="#9e7428" stroke-width="0.5"/>
          <circle cx="149.2" cy="64" r="0.9" fill="#ffffff" opacity="0.9"/>
          <!-- Cusp joints pearls -->
