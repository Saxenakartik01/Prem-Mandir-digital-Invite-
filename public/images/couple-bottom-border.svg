        <g>
          <!-- Jharokha arch frame -->
          <path d="M 500 34 
                   C 508 44, 518 44, 525 39 
                   C 533 51, 545 55, 550 48 
                   C 555 55, 567 51, 575 39 
                   C 582 44, 592 44, 600 34" 
